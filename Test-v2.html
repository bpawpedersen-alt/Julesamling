<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#103b2e"><title>Julesamlingen</title><link rel="manifest" href="manifest.webmanifest"><style>*{box-sizing:border-box}body{margin:0;background:#f7f2e7;color:#173a2d;font:16px system-ui,Arial}header{background:#103b2e;color:#fff;padding:22px 18px}h1{margin:0;font-family:Georgia,serif;font-size:30px}header p{margin:6px 0 0;color:#e6d8b7}main{max-width:700px;margin:auto;padding:16px}button,input{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:11px 14px;background:#174d3b;color:#fff}button.secondary{background:#e8decb;color:#173a2d}button:disabled{opacity:.5}input{width:100%;padding:12px;border:1px solid #d1c6b4;border-radius:12px;background:white}nav{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}nav button.active{background:#b48b40}section{display:none}section.active{display:block}.card{display:flex;gap:13px;background:#fff;border-radius:17px;margin:12px 0;padding:12px;box-shadow:0 2px 12px #1a302010}.card img{width:115px;height:140px;object-fit:cover;border-radius:12px}.details{flex:1;min-width:0}.details h3{margin:0 0 4px}.muted{color:#65776c;font-size:13px;overflow-wrap:anywhere}.qty{display:flex;align-items:center;gap:10px;margin-top:10px}.qty button{padding:7px 13px}.panel{background:white;padding:16px;border-radius:16px;margin:12px 0}label{display:block;margin:12px 0 5px;font-weight:600}video{width:100%;border-radius:12px;background:#111;max-height:350px}.notice{font-size:14px;color:#56685b}#cameraArea{display:none}footer{text-align:center;padding:20px;font-size:12px;color:#647469}</style></head><body><header><h1>🎄 Julesamlingen</h1><p>Vores private Brink Nordic-samling</p></header><main><p id="stats"></p><nav><button class="active" data-tab="collection">Vores samling</button><button data-tab="catalog">Katalog</button><button data-tab="wishlist">Ønskeliste</button><button data-tab="add">Tilføj</button><button data-tab="scan">Scan</button></nav><section id="collection" class="active"><input id="search" placeholder="Søg navn, varenummer eller stregkode"><div id="owned"></div></section><section id="catalog"><div id="all"></div></section><section id="wishlist"><div id="wishes"></div></section><section id="add"><div class="panel"><h2>Tilføj eget julepynt</h2><form id="addForm"><label>Navn</label><input id="name" required placeholder="Fx Nisse med tromme"><label>Varenummer</label><input id="sku" placeholder="Valgfrit"><label>Stregkode</label><input id="ean" inputmode="numeric" placeholder="13 cifre (valgfrit)"><label>Billede</label><input id="photo" type="file" accept="image/*" capture="environment"><p><button type="submit">Gem i samlingen</button></p></form></div></section><section id="scan"><div class="panel"><h2>Scan en stregkode</h2><p class="notice">Kamera kræver normalt, at appen åbnes fra en sikker HTTPS-adresse. Hvis scanning ikke virker, kan du skrive stregkoden nedenfor.</p><button id="startCamera">Start kamera</button> <button id="stopCamera" class="secondary">Stop</button><div id="cameraArea"><video id="video" playsinline muted autoplay></video></div><label>Indtast stregkode</label><input id="scanCode" inputmode="numeric" placeholder="Fx 5714259039890"><p><button id="lookup">Find produkt</button></p><div id="scanResult"></div></div></section></main><footer>Testversion · Gemmer kun på denne enhed · Eksportér gerne en sikkerhedskopi</footer><script>
const initial=[{id:'5714259039890',name:'Poinsettia – Julestjerne',sku:'F4 44',ean:'5714259039890',image:'assets/blomst.jpg',qty:1,wish:false},{id:'5714259040209',name:'Poinsettia – Julekugle',sku:'B6 40',ean:'5714259040209',image:'assets/kugle.jpg',qty:1,wish:false}];let products;try{products=JSON.parse(localStorage.getItem('julesamling_v2'))||initial}catch{products=initial}const save=()=>{try{localStorage.setItem('julesamling_v2',JSON.stringify(products))}catch{alert('Der er ikke mere lagerplads til billeder. Prøv et mindre billede.')}};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function card(p){return `<article class="card"><img src="${esc(p.image||'')}" alt="${esc(p.name)}"><div class="details"><h3>${esc(p.name)}</h3><div class="muted">${esc(p.sku)}<br>${esc(p.ean)}</div><div class="qty"><button data-action="minus" data-id="${esc(p.id)}">−</button><strong>${p.qty} stk.</strong><button data-action="plus" data-id="${esc(p.id)}">+</button></div><p><button class="secondary" data-action="wish" data-id="${esc(p.id)}">${p.wish?'♥ På ønskelisten':'♡ Ønskeliste'}</button></p></div></article>`}function render(){document.getElementById('stats').textContent=`${products.filter(p=>p.qty>0).length} forskellige produkter · ${products.reduce((n,p)=>n+p.qty,0)} stk. i alt`;let q=document.getElementById('search').value.toLowerCase();document.getElementById('owned').innerHTML=products.filter(p=>p.qty>0&&[p.name,p.sku,p.ean].join(' ').toLowerCase().includes(q)).map(card).join('')||'<p>Ingen produkter fundet.</p>';document.getElementById('all').innerHTML=products.map(card).join('');document.getElementById('wishes').innerHTML=products.filter(p=>p.wish).map(card).join('')||'<p>Ønskelisten er tom.</p>'}document.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b)return;let p=products.find(p=>p.id===b.dataset.id);if(!p)return;if(b.dataset.action==='plus')p.qty++;if(b.dataset.action==='minus')p.qty=Math.max(0,p.qty-1);if(b.dataset.action==='wish')p.wish=!p.wish;save();render()});document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('section').forEach(s=>s.classList.toggle('active',s.id===b.dataset.tab));if(b.dataset.tab!=='scan')stopCamera()});document.getElementById('search').oninput=render;
document.getElementById('addForm').onsubmit=async e=>{e.preventDefault();let name=document.getElementById('name').value.trim(),sku=document.getElementById('sku').value.trim(),ean=document.getElementById('ean').value.trim(),file=document.getElementById('photo').files[0];if(ean&&products.some(p=>p.ean===ean)){alert('Stregkoden findes allerede. Brug + på produktet.');return}let img='';if(file){img=await new Promise((resolve,reject)=>{let im=new Image(),url=URL.createObjectURL(file);im.onload=()=>{let c=document.createElement('canvas'),scale=Math.min(1,650/Math.max(im.width,im.height));c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);resolve(c.toDataURL('image/jpeg',.72))};im.onerror=reject;im.src=url})}products.push({id:ean||'own-'+Date.now(),name,sku,ean,image:img,qty:1,wish:false});save();render();e.target.reset();alert('Tilføjet til samlingen!')};let stream=null,scanning=false;function lookup(code){let p=products.find(p=>p.ean===code);document.getElementById('scanResult').innerHTML=p?`<h3>Fundet!</h3>${card(p)}`:`<p>Stregkoden ${esc(code)} findes ikke endnu. Vælg “Tilføj” for at oprette produktet.</p>`}document.getElementById('lookup').onclick=()=>lookup(document.getElementById('scanCode').value.trim());function stopCamera(){scanning=false;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}document.getElementById('cameraArea').style.display='none'}document.getElementById('stopCamera').onclick=stopCamera;document.getElementById('startCamera').onclick=async()=>{if(!('BarcodeDetector'in window)){alert('Denne browser understøtter ikke automatisk stregkodescanning. Brug feltet til manuel indtastning.');return}try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});let video=document.getElementById('video');video.srcObject=stream;document.getElementById('cameraArea').style.display='block';await video.play();let detector=new BarcodeDetector({formats:['ean_13','ean_8','code_128']});scanning=true;async function tick(){if(!scanning)return;try{let codes=await detector.detect(video);if(codes.length){let code=codes[0].rawValue;document.getElementById('scanCode').value=code;lookup(code);stopCamera();return}}catch{}if(scanning)setTimeout(tick,250)}tick()}catch(err){alert('Kameraet kunne ikke åbnes. Brug HTTPS og giv kameratilladelse.');stopCamera()}};render();
</script></body></html>
